# Single source of truth for gripper/end-effector & per-arm robot config.

# See franka_launch/config for any config parameters you wish to overwrite
# end_effector_frame: auto selects the frame from gripper_type:
# None -> franka_{left,right}_fr3_link8; otherwise -> franka_{left,right}_grasp_point.
# Set an explicit frame name instead of auto to use a custom tool frame.

spawn_franka_left: true
spawn_franka_right: true
use_fake_hardware: false
bypass_safety: true

franka_left:
  robot_ip: "192.168.1.4"
  end_effector_frame: auto
  gripper_port: "/dev/dynamixel_left"
  gripper_type: "rh_p12_rn_a" # rh_p12_rn_a/franka_default/None
  arm_controller: "joint_impedance_controller" # joint_impedance_controller/joint_trajectory_controller/bspline_joint_controller

franka_right:
  robot_ip: "192.168.0.2"
  end_effector_frame: auto
  gripper_port: "/dev/dynamixel_right"
  gripper_type: None #"rh_p12_rn_a" # rh_p12_rn_a/franka_default/None
  arm_controller: "joint_impedance_controller" # joint_impedance_controller/joint_trajectory_controller/bspline_joint_controller
